<section>
    <form [formGroup]="transactionForm" (submit)="submitTransaction()">
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Timestamp</mat-label>
            <input matInput [formControl]="transactionForm.controls.timestamp" required type="datetime-local">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Amount</mat-label>
            <input matInput [formControl]="transactionForm.controls.amount" type="number">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Source Account</mat-label>
            <mat-select [formControl]="transactionForm.controls.source_account" required>
                @for (account of accounts$ | async; track account.id) {
                    <mat-option [value]="account.id">{{ account.name }}</mat-option>
                }
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Destination Account</mat-label>
            <mat-select [formControl]="transactionForm.controls.destination_account" required>
                @for (account of accounts$ | async; track account.id) {
                    <mat-option [value]="account.id">{{ account.name }}</mat-option>
                }
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Description</mat-label>
            <textarea matInput [formControl]="transactionForm.controls.description"></textarea>
        </mat-form-field>

        <app-form-button [isUpdate]="isUpdate"></app-form-button>
    </form>
</section>
