<section>
 <h1>Transactions</h1>

 <a matButton routerLink="/wimm/transactions/create">
    <mat-icon fontIcon="add"></mat-icon>
    Add
 </a>

 <a matButton routerLink="/wimm/budget/apply">Apply Budget</a>

  <div class="card-container">
    
      @for (transaction of transactions$ | async; track transaction.id) {
        <app-transaction-card [transaction]="transaction"></app-transaction-card>
      } @empty {
        <app-loading-spinner loadingMessage="Loading transactions.."></app-loading-spinner>
      }
    
  </div>
  
</section>
