<mat-toolbar>
    <button matIconButton (click)="sidenav.toggle()">
        <mat-icon fontIcon="menu"></mat-icon>
    </button>
    <span>
        <a matButton routerLink="/wimm">WIMM</a>
    </span>
    <span class="spacer"></span>
    @if (authService.getUsername() !== null) {
        <button matButton [matMenuTriggerFor]="userMenu">
            <mat-icon fontIcon="account_circle"></mat-icon>
            {{ authService.getUsername() }}
        </button>
        <mat-menu #userMenu>
            <a mat-menu-item target="_blank" [routerLink]="['/users/me']">
                <mat-icon fontIcon="settings_account_box"></mat-icon>
                Details
            </a>
            <a mat-menu-item (click)="logoutAction()">
                <mat-icon fontIcon="logout"></mat-icon>
                Logout
            </a>
        </mat-menu>
    } @else {
        <a matButton routerLink="/auth/login">
            <mat-icon fontIcon="login"></mat-icon>
            Login
        </a>
        <a matButton routerLink="/users/create">
            <mat-icon fontIcon="person_add"></mat-icon>
            Register
        </a>
    }
</mat-toolbar>
<mat-sidenav-container>
    <mat-sidenav #sidenav [(opened)]="sidebarOpened" mode="side" class="sidenav">
        <mat-nav-list>
            <a mat-list-item routerLink="/wimm">
                <mat-icon matListItemIcon fontIcon="dashboard"></mat-icon>
                Dashboard
            </a>
            <a mat-list-item routerLink="/wimm/accounts">
                <mat-icon matListItemIcon fontIcon="wallet"></mat-icon>
                Accounts
            </a>
            <a mat-list-item routerLink="/wimm/transactions">
                <mat-icon matListItemIcon fontIcon="currency_exchange"></mat-icon>
                Transactions
            </a>
            <a mat-list-item routerLink="/wimm/configuration/detail">
                <mat-icon matListItemIcon fontIcon="settings"></mat-icon>
                Configuration
            </a>
            <a mat-list-item routerLink="/wimm/configuration/detail">
                <mat-icon matListItemIcon fontIcon="info"></mat-icon>
                About
            </a>
        </mat-nav-list>
        
    </mat-sidenav>    
    <mat-sidenav-content class="main-content">
        <router-outlet />
    </mat-sidenav-content>
</mat-sidenav-container>
