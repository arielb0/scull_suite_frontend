<h2 mat-dialog-title>Delete transaction confirmation</h2>

<mat-dialog-content>
    <p>Are you sure to delete the transaction?</p>
</mat-dialog-content>

<mat-dialog-actions>
    <button matButton="filled" mat-dialog-close="">No</button>
    <button matButton="outlined" (click)="deleteTransaction(data.id)">Yes</button>
</mat-dialog-actions>
