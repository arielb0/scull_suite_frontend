<h2 mat-dialog-title>Delete account confirmation</h2>

<mat-dialog-content>
    <p>Are you sure to delete the account?</p>
</mat-dialog-content>

<mat-dialog-actions>
    <button matButton="filled" mat-dialog-close="">No</button>
    <button matButton="outlined" (click)="deleteAccount(data.id)">Yes</button>
</mat-dialog-actions>
