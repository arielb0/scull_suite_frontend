<mat-expansion-panel class="expansion-panel">
    <mat-expansion-panel-header>
        <mat-panel-title>{{ amount() }}</mat-panel-title>
        <mat-panel-description>{{ transaction().source_account_name }} -> {{ transaction().destination_account_name }}</mat-panel-description>
    </mat-expansion-panel-header>
    <mat-list>
        <mat-list-item>
            <mat-icon matListItemIcon fontIcon="calendar_month"></mat-icon>
            <span matListItemTitle>{{ localDate().substring(0, 10)}}</span>
        </mat-list-item>
        <mat-list-item>
            <mat-icon matListItemIcon fontIcon="schedule"></mat-icon>
            <span matListItemTitle>{{ localDate().substring(11, 19)}}</span>
        </mat-list-item>
    </mat-list>
    
    <p>{{ transaction().description }}</p>

    <app-transaction-actions [transaction]="transaction()"></app-transaction-actions>
</mat-expansion-panel>
