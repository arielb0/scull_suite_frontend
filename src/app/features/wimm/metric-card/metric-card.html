<mat-card class="metric-card" [style.background-color]="accountService.getBackgroundColor(color())">
    <mat-card-header>
        <h2 class="metric-name">{{ metricName() }}</h2>
    </mat-card-header>
    <mat-card-content>
        <span class="metric-value">
            {{ metricValue() }}
        </span>
    </mat-card-content>
</mat-card>
