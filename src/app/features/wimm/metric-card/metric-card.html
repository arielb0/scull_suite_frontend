<mat-card class="metric-card">
    <mat-card-header>
        <h2 class="metric-name">{{ metricName() }}</h2>
    </mat-card-header>
    <mat-card-content>
        <!-- Here you can put a chart (optionally) -->
        <span class="metric-value">
            {{ metricValue() }}
        </span>
    </mat-card-content>
</mat-card>
