<section>
    <form [formGroup]="userForm" (submit)="submitUser()">
        <div class="form-container">
            <mat-card class="card-style">
                <h1 class="text-form">Register</h1>

                <mat-form-field>
                    <mat-label>Username</mat-label>
                    <input matInput [formControl]="userForm.controls.username" required />
                </mat-form-field>

                <mat-form-field>
                    <mat-label>Email</mat-label>
                    <input matInput [formControl]="userForm.controls.email" required type="email"/>
                </mat-form-field>

                <mat-form-field>
                    <mat-label>Password</mat-label>
                    <input matInput [formControl]="userForm.controls.password" required type="password"/>
                </mat-form-field>
                                
                <a class="text-form" routerLink="/users/resend-activation">Request a new activation link</a>

                <button matButton="filled">Register</button>
            </mat-card>
        </div>
    </form>
</section>
