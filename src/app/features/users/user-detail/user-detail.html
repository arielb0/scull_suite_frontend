<section class="main-section">
  @if (user$| async; as user) {

    <mat-list>
      <h1>My Account Data</h1>
      <div class="list-container">
        <mat-list-item>
          <strong>Username:</strong> {{ user.username }}
        </mat-list-item>
        <mat-list-item>
          <strong>Email:</strong> {{ user.email }}
        </mat-list-item>
        <mat-list-item>
          <a matButton="filled" routerLink="/users/set_password">
            <mat-icon fontIcon="edit"></mat-icon>
            Change Password
          </a>
        </mat-list-item>
        <mat-list-item>
          <a matButton="outlined" routerLink="/users/set_username">
            <mat-icon fontIcon="edit"></mat-icon>
            Change Username
          </a>
        </mat-list-item>
        <mat-list-item>
          <button matButton (click)="openDeleteDialog()">
            <mat-icon fontIcon="delete"></mat-icon>
            Delete your account
          </button>
        </mat-list-item>
      </div>
    </mat-list>
  } @else {
    <p>Loading data..</p>
  }
</section>
