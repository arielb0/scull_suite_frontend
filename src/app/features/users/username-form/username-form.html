<section>
    <form [formGroup]="usernameForm" (submit)="submitUsername()">
        <div class="form-container">
            <mat-card class="card-style">
                <h1>Change Username</h1>
                <mat-form-field>
                    <mat-label>New Username</mat-label>
                    <input matInput [formControl]="usernameForm.controls.username" required />
                </mat-form-field>

                <mat-form-field>
                    <mat-label>Password</mat-label>
                    <input matInput [formControl]="usernameForm.controls.password" required type="password"/>
                </mat-form-field>

                <button matButton="filled">Change username</button>
            </mat-card>
            
        </div>
    </form>
</section>
