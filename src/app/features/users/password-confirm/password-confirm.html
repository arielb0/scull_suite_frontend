<form [formGroup]="passwordConfirmForm" (submit)="submitPasswordConfirmation()">
    
    <div class="form-container">
        <mat-card class="card-style">
            <h1>Reset Password</h1>

            <mat-form-field>
                <mat-label>New Password</mat-label>
                <input matInput [formControl]="passwordConfirmForm.controls.newPassword" required type="password"/>
            </mat-form-field>

            <button matButton="filled">Reset Password</button>
        </mat-card>
    </div>
</form>
